<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Register - FF Tools Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#ff6b00;--primary-dark:#cc5500;--primary-light:#ff8c38;--primary-glow:rgba(255,107,0,0.4);--bg-primary:#0a0a0f;--bg-secondary:#111118;--bg-card:#161620;--text-primary:#f0eeff;--text-secondary:#a8a0c8;--text-muted:#6a6288;--border-color:#2a2a3a;--shadow:0 8px 32px rgba(0,0,0,0.5);--shadow-glow:0 8px 32px rgba(255,107,0,0.3);--radius:16px;--radius-sm:10px;--transition:all 0.4s cubic-bezier(0.4,0,0.2,1)}
        body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:var(--bg-primary)}
        ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes glow{0%,100%{box-shadow:0 0 20px var(--primary-glow)}50%{box-shadow:0 0 60px var(--primary-glow)}}
        @keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        @keyframes pulse-ring{0%{transform:scale(1);opacity:0.8}100%{transform:scale(1.5);opacity:0}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
        @keyframes successBounce{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}70%{transform:scale(0.95)}100%{transform:scale(1);opacity:1}}
        .register-container{width:100%;max-width:420px;animation:fadeInUp 0.6s ease}
        .register-card{background:var(--bg-card);border-radius:var(--radius);padding:40px 32px;border:1px solid var(--border-color);box-shadow:var(--shadow);transition:var(--transition);position:relative;overflow:hidden}
        .register-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at center,rgba(255,107,0,0.03),transparent 70%);pointer-events:none}
        .register-card:hover{border-color:var(--primary);box-shadow:var(--shadow-glow)}
        .register-header{text-align:center;margin-bottom:32px}
        .register-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin:0 auto 12px;box-shadow:0 4px 20px var(--primary-glow);animation:glow 2s infinite;position:relative;transition:var(--transition)}
        .register-logo:hover{transform:scale(1.05) rotate(-5deg)}
        .register-logo::after{content:'';position:absolute;inset:-4px;border-radius:20px;border:2px solid var(--primary);opacity:0.3;animation:pulse-ring 2s infinite}
        .register-title{font-size:24px;font-weight:800}
        .text-gradient{background:linear-gradient(135deg,#ff6b00,#ff8c38,#ffb06b,#ff6b00);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 4s ease infinite}
        .register-subtitle{color:var(--text-muted);font-size:13px;margin-top:4px}
        .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:12px;font-weight:500;transition:var(--transition);margin-bottom:20px;padding:6px 14px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border-color)}
        .back-link:hover{color:var(--primary-light);border-color:var(--primary);transform:translateX(-3px)}
        .form-group{margin-bottom:16px;animation:fadeInUp 0.4s ease}
        .form-label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
        .form-label .required{color:#ef4444}
        .form-input{width:100%;padding:14px 16px;background:var(--bg-secondary);border:2px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;font-family:'Inter',sans-serif;transition:var(--transition);outline:none}
        .form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-glow);transform:translateY(-1px)}
        .form-input::placeholder{color:var(--text-muted);font-size:13px}
        .form-input.error{border-color:#ef4444;animation:shake 0.4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-5px)}20%,40%,60%,80%{transform:translateX(5px)}}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:var(--transition);border:none;width:100%;position:relative;overflow:hidden}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,0.05));pointer-events:none}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 20px var(--primary-glow)}
        .btn-primary:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 8px 35px var(--primary-glow)}
        .btn-primary:active{transform:scale(0.97)}
        .btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
        .btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
        .register-footer{margin-top:20px;text-align:center;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border-color);padding-top:18px}
        .register-footer .footer-links{display:flex;justify-content:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
        .register-footer .footer-links a{color:var(--text-muted);text-decoration:none;font-weight:500;transition:var(--transition);font-size:12px;display:inline-flex;align-items:center;gap:4px}
        .register-footer .footer-links a:hover{color:var(--primary-light)}
        .register-footer .footer-divider{color:var(--border-color)}
        .register-footer .support-text{font-size:11px;color:var(--text-muted)}
        .register-footer .support-text strong{color:var(--primary-light);font-weight:600}
        .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#ef4444;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none;animation:fadeInUp 0.3s ease}
        .error-msg.show{display:block}
        .success-msg{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#22c55e;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none;animation:successBounce 0.5s ease}
        .success-msg.show{display:block}
        .info-box{background:rgba(255,107,0,0.06);border:1px solid rgba(255,107,0,0.1);padding:12px 14px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);margin-top:12px;display:flex;align-items:flex-start;gap:10px}
        .info-box i{color:var(--primary-light);margin-top:2px;font-size:16px}
        @media(max-width:420px){.register-card{padding:28px 20px}.register-title{font-size:20px}.register-logo{width:54px;height:54px;font-size:22px}.register-footer .footer-links{gap:10px;flex-direction:column;align-items:center}.register-footer .footer-divider{display:none}}
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">

            <!-- Back to Login -->
            <a href="/login" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>

            <div class="register-header">
                <div class="register-logo">🔥</div>
                <h1 class="register-title"><span class="text-gradient">FF Tools Pro</span></h1>
                <p class="register-subtitle">Create your account • <span style="color:#22c55e;">Instant Activation</span></p>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="error-msg">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText">Error</span>
            </div>

            <!-- Success Message -->
            <div id="successMsg" class="success-msg">
                <i class="fas fa-check-circle"></i> <span id="successText">Account created! Redirecting...</span>
            </div>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Username <span class="required">*</span></label>
                    <input type="text" class="form-input" id="username" placeholder="Choose a username (min 3 chars)" required autofocus />
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-input" id="email" placeholder="your@email.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" class="form-input" id="password" placeholder="Min 6 characters" required />
                </div>
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <!-- Info Box -->
            <div class="info-box">
                <i class="fas fa-bolt"></i>
                <div>
                    <strong style="color:var(--text-primary);">Instant Access!</strong><br>
                    No approval needed. Create account and login immediately.
                </div>
            </div>

            <!-- Footer -->
            <div class="register-footer">
                <div class="footer-links">
                    <a href="/login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                    <span class="footer-divider">|</span>
                    <a href="/">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <span class="footer-divider">|</span>
                    <a href="https://t.me/FF_TOOLS_PRO" target="_blank">
                        <i class="fab fa-telegram-plane"></i> Support
                    </a>
                </div>
                <p class="support-text">
                    Already have an account? <strong><a href="/login" style="color:var(--primary-light);text-decoration:none;">Login here</a></strong>
                </p>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // HANDLE REGISTER - AUTO APPROVE
        // ============================================================
        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const successMsg = document.getElementById('successMsg');
            const successText = document.getElementById('successText');

            // Reset
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

            // Validation
            if (!username || !email || !password) {
                errorText.textContent = 'Please fill in all fields';
                errorMsg.classList.add('show');
                if (!username) document.getElementById('username').classList.add('error');
                if (!email) document.getElementById('email').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            if (username.length < 3) {
                errorText.textContent = 'Username must be at least 3 characters';
                errorMsg.classList.add('show');
                document.getElementById('username').classList.add('error');
                return;
            }

            if (password.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters';
                errorMsg.classList.add('show');
                document.getElementById('password').classList.add('error');
                return;
            }

            if (!email.includes('@')) {
                errorText.textContent = 'Please enter a valid email address';
                errorMsg.classList.add('show');
                document.getElementById('email').classList.add('error');
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating Account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (data.success) {
                    // ✅ Success - Auto approved!
                    successText.textContent = '✅ Account created successfully! Redirecting to login...';
                    successMsg.classList.add('show');
                    btn.innerHTML = '<i class="fas fa-check"></i> Account Created!';
                    
                    // Clear form
                    document.getElementById('username').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 2000);
                } else {
                    errorText.textContent = data.error || 'Registration failed. Please try again.';
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch (err) {
                errorText.textContent = 'Network error. Please check your connection.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        }

        // ============================================================
        // CHECK SESSION
        // ============================================================
        async function checkSession() {
            try {
                const res = await fetch('/api/auth/check');
                const data = await res.json();
                if (data.logged_in) {
                    if (data.user.is_admin) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/dashboard';
                    }
                }
            } catch (e) {}
        }

        // ============================================================
        // CHECK FOR REGISTRATION SUCCESS PARAM
        // ============================================================
        function checkRegistrationSuccess() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('registered') === 'true') {
                const successMsg = document.getElementById('successMsg');
                const successText = document.getElementById('successText');
                successText.textContent = '✅ Account created! Please login.';
                successMsg.classList.add('show');
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            // Escape -> Landing page
            if (e.key === 'Escape') {
                window.location.href = '/';
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
            checkRegistrationSuccess();
            document.getElementById('username').focus();
            console.log('🔥 FF Tools Pro - Auto Registration Page');
            console.log('📌 No approval needed - Instant access!');
        });

        // Enter key triggers submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const form = document.getElementById('registerForm');
                if (form) {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>

</body>
</html>
